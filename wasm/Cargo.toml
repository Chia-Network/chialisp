[package]
name = "clvm_tools_wasm"
version = "0.5.0"
edition = "2018"
authors = ["Art Yerkes <art.yerkes@gmail.com>"]
description = "tools for working with chialisp language; compiler, repl, python and wasm bindings"
homepage = "https://prozacchiwawa.github.io/chialisp/"
readme = "README.md"
repository = "https://github.com/Chia-Network/chialisp"
license = "MIT"
keywords = ["chia", "chialisp", "clvm"]
categories = ["command-line-utilities"]

[lib]
name = "clvm_tools_wasm"
crate-type = ["cdylib"]
path = "src/mod.rs"

[dependencies]
chialisp = { path= "..", features = [] }
clvmr = { git = "https://github.com/Chia-Network/clvm_rs.git", rev = "c6f211ea7f42af93d3e6df6936ab78c8a8bcb7cd", features = ["pre-eval"] }
wasm-bindgen = "=0.2.101"
js-sys = "0.3.78"
num-bigint = "0.4.0"
num-traits = "0.2.15"
lol_alloc = "0.4.1"

# Enable browser entropy for both generations used by evaluator dependencies.
getrandom = { version = "0.3.4", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4.3", features = ["wasm_js"] }
