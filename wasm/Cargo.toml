[package]
name = "clvm_tools_wasm"
version = "0.7.0"
edition = "2018"
authors = ["Art Yerkes <art.yerkes@gmail.com>"]
description = "tools for working with chialisp language; compiler, repl, python and wasm bindings"
homepage = "https://prozacchiwawa.github.io/chialisp/"
readme = "README.md"
repository = "https://github.com/Chia-Network/chialisp"
license = "MIT"
keywords = ["chia", "chialisp", "clvm"]
categories = ["command-line-utilities"]

[lib]
name = "clvm_tools_wasm"
crate-type = ["cdylib"]
path = "src/mod.rs"

[dependencies]
chialisp = { path= "..", features = [] }
clvmr = { version = "0.22.0", features = ["pre-eval"] }
wasm-bindgen = "=0.2.130"
js-sys = "0.3.107"
num-bigint = "0.4.8"
num-traits = "0.2.19"
lol_alloc = "0.4.1"

# Enable browser entropy for evaluator dependencies.
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
