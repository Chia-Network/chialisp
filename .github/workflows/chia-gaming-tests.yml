name: Chia Gaming tests

on:
  push:
    branches:
      - main
      - dev
    tags:
        - '**'
  pull_request:
    branches:
      - '**'

permissions:
  id-token: write
  contents: read

jobs:
  chia_gaming_tests:
    name: Extensive Chia Gaming tests
    permissions:
      contents: read

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Checkout chia-gaming
      uses: actions/checkout@v7
      with:
        repository: Chia-Network/chia-gaming
        path: chia-gaming
        ref: 2e1b2fbdb23b2e9236c7086658ae29f5e90b1949

    - name: Replace chialisp pkg in chia-gaming
      run: |
        python3 support/change-chialisp-rev.py ${{ github.sha }} chia-gaming/Cargo.toml

    - name: Install chia-gaming dependencies
      run: |
        cd chia-gaming
        ./tools/check-build-deps.sh --install --yes

    - name: Rebuild chia-gaming chialisp
      run: |
        cd chia-gaming
        ./tools/build-chialisp.sh

    - name: Run chia-gaming chialisp tests
      run: |
        cd chia-gaming
        # Build without sim-tests to ensure that configuration compiles
        cargo test --no-run
        # Run simulator tests (matches local ct.sh)
        cargo test --lib --features sim-tests,sim-server -- --nocapture
