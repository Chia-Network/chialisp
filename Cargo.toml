[package]
name = "clvm_tools_rs"
version = "0.4.0"
edition = "2018"
authors = ["Art Yerkes <art.yerkes@gmail.com>"]
description = "tools for working with chialisp language; compiler, repl, wasm bindings"
readme = "README.md"
repository = "https://github.com/Chia-Network/clvm_tools_rs"
license = "Apache-2.0"
keywords = ["chia", "chialisp", "clvm"]
categories = ["command-line-utilities"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hex = "0.4.3"
num-bigint = { version = "0.4.0", features = ["serde"], default-features = false }
num-traits = { version = "0.2.14", default-features = false }
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
unicode-segmentation = { version = "1.12.0", default-features = false }
num = { version = "0.4.3", default-features = false }
indoc = "2.0"
do-notation = "0.1.3"
# serde_json = "1.0" # Not no_std compatible
sha2 = { version = "0.10.9", default-features = false }
# tempfile = "3.22.0" # Not no_std compatible
clvmr = { version = "0.16.2", features = ["pre-eval"], default-features = false }
binascii = "0.1.4"
# yaml-rust2 = "0.10.3" # Not no_std compatible
hashlink = "0.10.0"
hashbrown = "0.15.2"
serde = { version = "1.0", features = ["derive", "rc"] }
# regex = "1.11.2" # Not no_std compatible
rand = { version = "0.9.2", optional = true }
rand_chacha = { version = "0.9.0", optional = true }
lfsr = { version = "0.3.0", optional = true }
# chia-bls = "0.28.2" # TODO(BLS): restore when re-enabling BLS operators/types

[dev-dependencies]
rand = "0.9.2"
rand_chacha = "0.9.0"
lfsr = "0.3.0"

[lib]
name = "clvm_tools_rs"
crate-type = ["cdylib", "rlib"]

[features]
fuzz = ["dep:rand", "dep:rand_chacha", "dep:lfsr"]
default = []

[target.'cfg(target_family="wasm")'.dependencies]
wasm-bindgen = { version = "0.2.100", features = ["serde-serialize"] }
js-sys = "0.3.58"
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_family="wasm"))'.dependencies]
getrandom = { version = "0.2" }

## CLI binaries removed for no_std prep
