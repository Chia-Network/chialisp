[package]
name = "clvm_tools_rs"
version = "0.4.0"
edition = "2018"
authors = ["Art Yerkes <art.yerkes@gmail.com>"]
description = "tools for working with chialisp language; compiler, repl, wasm bindings"
readme = "README.md"
repository = "https://github.com/Chia-Network/clvm_tools_rs"
license = "Apache-2.0"
keywords = ["chia", "chialisp", "clvm"]
categories = ["command-line-utilities"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# MINIMAL DEPENDENCIES FOR CHIALISP COMPILATION ONLY
[dependencies]
# Core compilation dependencies
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
num-bigint = { version = "0.4.0", features = ["serde"], default-features = false }
num-traits = { version = "0.2.14", default-features = false }
num = { version = "0.4.3", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
clvmr = { version = "0.16.2", features = ["pre-eval"], default-features = false }
serde = { version = "1.0.226", features = ["derive", "rc", "alloc"], default-features = false }

# Macro/compiler infrastructure  
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
indoc = "2.0"
do-notation = "0.1.3"

# REMOVED DEPENDENCIES (not needed for ChiaLisp compilation):
# binascii = "0.1.4"             # Only used for dev tools
# unicode-segmentation = "1.12.0" # Only used for advanced text processing
# hashlink = "0.10.0"           # Not used by core compilation
# hashbrown = "0.15.2"          # Not used by core compilation  
# rand/rand_chacha/lfsr          # Only for fuzzing tests
# serde_json/tempfile/yaml-rust2/regex # Not no_std compatible

[dev-dependencies]
rand = "0.9.2"
rand_chacha = "0.9.0"
lfsr = "0.3.0"

[lib]
name = "clvm_tools_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []

# For now, clvmr doesn't have optional BLS - all builds include it
# TODO: Create minimal CLVM runtime without BLS for true no_std

[target.'cfg(target_family="wasm")'.dependencies]


getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_family="wasm"))'.dependencies]
getrandom = { version = "0.2" }

## CLI binaries removed for no_std prep

# Note: Some transitive dependencies still pull in std through clvmr's crypto stack
# For full no_std compatibility, these would need to be replaced or patched at the source
